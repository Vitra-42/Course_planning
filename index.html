<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Тотальная выгрузка</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="scene">

    <!-- Заголовок -->
    <header class="header">

        <div class="title-block">
            <div class="title-jp">頭の中を整理する</div>
            <h1>ТОТАЛЬНАЯ ВЫГРУЗКА</h1>
            <p>
                Сначала выгрузи всё. Потом начинай разбираться.
            </p>
        </div>

        <div class="progress">
            <span id="counter">0</span>
            <span class="counter-separator">/</span>
            <span>40</span>
            <small>структурировано</small>
        </div>

    </header>


    <!-- Доска -->
    <main class="board" id="board">

        <div class="board-decoration decoration-1"></div>
        <div class="board-decoration decoration-2"></div>

        <!-- Стикеры создаются JavaScript -->

    </main>


    <!-- Подсказка -->
    <div class="hint">

        <span class="hint-icon">✦</span>

        <span>
            Нажми на любой стикер,
            чтобы превратить мысль в структуру действий
        </span>

    </div>

</div>


<script src="app.js"></script>

</body>
</html>
