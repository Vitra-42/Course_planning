/* =========================================================
   ОСНОВНЫЕ НАСТРОЙКИ
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
}

body {
    font-family:
        "Trebuchet MS",
        "Segoe UI",
        Arial,
        sans-serif;

    color: #34271d;
}


/* =========================================================
   ДЕРЕВЯННАЯ ДОСКА
========================================================= */

.board {
    position: fixed;
    inset: 0;

    overflow: hidden;

    background:
        repeating-linear-gradient(
            7deg,
            transparent 0px,
            transparent 42px,
            rgba(45,20,8,.10) 43px,
            rgba(45,20,8,.10) 46px,
            transparent 47px,
            transparent 91px
        ),

        repeating-linear-gradient(
            171deg,
            rgba(255,225,180,.035) 0px,
            rgba(255,225,180,.035) 2px,
            transparent 3px,
            transparent 14px
        ),

        linear-gradient(
            90deg,
            #5c381f 0%,
            #7b4d2c 18%,
            #6d4025 38%,
            #875331 58%,
            #683c23 78%,
            #54321e 100%
        );

    box-shadow:
        inset 0 0 120px rgba(0,0,0,.55),
        inset 0 0 30px rgba(0,0,0,.55);
}


.board::before {
    content: "";

    position: absolute;
    inset: 9px;

    border:
        4px solid
        rgba(38,18,8,.45);

    border-radius: 12px;

    box-shadow:
        inset 0 0 18px rgba(0,0,0,.45);

    pointer-events: none;

    z-index: 5;
}


/* =========================================================
   ЗАГОЛОВОК
========================================================= */

.header {
    position: fixed;

    top: 0;
    left: 0;

    width: 100%;

    padding:
        18px
        20px
        12px;

    text-align: center;

    z-index: 100;

    color: #f8e8c7;

    text-shadow:
        0 3px 8px rgba(0,0,0,.65);

    transition:
        opacity .25s ease,
        visibility .25s ease;
}


body.sticker-is-open .header {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}


.header h1 {
    margin: 0;

    font-size:
        clamp(24px, 3vw, 40px);

    line-height: 1.12;

    font-weight: 700;
}


.header p {
    margin: 7px 0 0;

    font-size:
        clamp(14px, 1.3vw, 18px);

    opacity: .95;
}


/* =========================================================
   ОБЛАСТЬ СТИКЕРОВ
========================================================= */

.stickers-area {
    position: absolute;

    top: 105px;
    right: 15px;
    bottom: 15px;
    left: 15px;

    overflow: visible;
}


/* =========================================================
   ОБЫЧНЫЙ СТИКЕР
========================================================= */

.sticker {
    position: absolute;

    width: 150px;
    height: 120px;

    perspective: 1400px;

    cursor: pointer;

    transform:
        rotate(var(--rotation));

    z-index: 10;

    transition:
        filter .2s ease,
        transform .2s ease;
}


.sticker:not(.open):hover {

    transform:
        rotate(var(--rotation))
        scale(1.06);

    filter: brightness(1.06);

    z-index: 500;
}


/* =========================================================
   ВНУТРЕННОСТЬ СТИКЕРА
========================================================= */

.sticker-inner {
    position: relative;

    width: 100%;
    height: 100%;

    transform-style: preserve-3d;

    transition:
        transform
        .9s
        cubic-bezier(.22,.61,.36,1);
}


.sticker.flipped .sticker-inner {
    transform:
        rotateY(180deg);
}


/* =========================================================
   ЛИЦО / ОБОРОТ
========================================================= */

.sticker-front,
.sticker-back {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    border-radius: 3px;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;

    box-shadow:
        0 8px 16px rgba(0,0,0,.32),
        0 2px 4px rgba(0,0,0,.25);
}


/* =========================================================
   ЛИЦО
========================================================= */

.sticker-front {

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 15px;

    text-align: center;

    font-size: 17px;

    line-height: 1.25;

    font-weight: 700;

    color: #34261d;
}


/* =========================================================
   ОБОРОТ
========================================================= */

.sticker-back {

    transform:
        rotateY(180deg);

    display: flex;

    flex-direction: column;

    padding: 13px;

    overflow: hidden;
}


/* =========================================================
   ЗАГОЛОВОК ОБОРОТА
========================================================= */

.route-title {

    flex-shrink: 0;

    margin-bottom: 8px;

    padding-bottom: 7px;

    border-bottom:
        1px dashed
        rgba(70,42,24,.38);

    color: #4c3321;

    font-size: 10px;

    line-height: 1.25;

    font-weight: 800;

    letter-spacing: .65px;

    text-transform: uppercase;
}


/* =========================================================
   СПИСОК
========================================================= */

.route {

    flex: 1;

    min-height: 0;

    overflow-y: auto;

    padding-right: 4px;

    display: flex;

    flex-direction: column;

    gap: 5px;

    scrollbar-width: thin;

    scrollbar-color:
        rgba(70,45,27,.4)
        transparent;
}


.route-step {

    display: flex;

    align-items: flex-start;

    gap: 7px;

    flex-shrink: 0;

    color: #3b2d23;

    font-size: 11px;

    line-height: 1.3;
}


.route-text {

    flex: 1;

    min-width: 0;
}


.route-dot {

    width: 7px;
    height: 7px;

    margin-top: 4px;

    flex-shrink: 0;

    border-radius: 50%;

    background:
        #765337;
}


/* =========================================================
   FULLSCREEN-СЛОЙ
========================================================= */

.sticker-overlay {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    display: none;

    align-items: center;
    justify-content: center;

    background:
        transparent;

    z-index: 1000000;

    pointer-events: none;
}


.sticker-overlay.active {

    display: flex;

    pointer-events: auto;
}


/* =========================================================
   ОТКРЫТЫЙ СТИКЕР
========================================================= */

.sticker.open {

    position: relative !important;

    left: auto !important;
    top: auto !important;

    width:
        min(650px, calc(100vw - 40px));

    height:
        min(620px, calc(100vh - 40px));

    margin: 0 !important;

    transform: none !important;

    z-index: 1000001 !important;

    cursor: pointer;

    /*
       Стикер сначала появляется
       обычной стороной.
    */

    animation:
        stickerAppear
        .42s
        cubic-bezier(.22,.61,.36,1)
        both;
}


@keyframes stickerAppear {

    from {

        opacity: 0;

        transform:
            scale(.82);
    }

    to {

        opacity: 1;

        transform:
            scale(1);
    }
}


/* =========================================================
   ОТКРЫТЫЙ ОБОРОТ
========================================================= */

.sticker.open .sticker-back {

    padding: 28px;

    overflow: hidden;
}


.sticker.open .route-title {

    margin-bottom: 15px;

    padding-bottom: 11px;

    font-size: 15px;

    line-height: 1.3;
}


.sticker.open .route-step {

    gap: 10px;

    font-size: 15px;

    line-height: 1.42;
}


.sticker.open .route-dot {

    width: 9px;
    height: 9px;

    margin-top: 6px;
}


/* =========================================================
   АНИМАЦИЯ ВОЗВРАЩЕНИЯ
========================================================= */

/*
   При закрытии стикер НЕ переворачивается обратно.

   Он быстро уменьшается и исчезает.
*/

.sticker.returning {

    animation:
        stickerReturn
        .28s
        cubic-bezier(.4,0,1,1)
        forwards;
}


@keyframes stickerReturn {

    0% {

        opacity: 1;

        transform:
            scale(1);
    }

    100% {

        opacity: 0;

        transform:
            scale(.65);
    }
}


/* =========================================================
   МОБИЛЬНАЯ ВЕРСИЯ
========================================================= */

@media (max-width: 700px) {

    }

    }

    }

    }

    }

        font-size: 13px;
    }


    .sticker.open .route-step {

        font-size: 15px;

        line-height: 1.42;
    }
}

/* =========================================================
   ЦВЕТА
========================================================= */

const colors = [
    "#F2D99B",
    "#EFC78C",
    "#E5CBA5",
    "#D4DFAF",
    "#C7DDD3",
    "#E8C2A3",
    "#F0D2A4",
    "#D8D9A8"
];


/* =========================================================
   ПЕРЕМЕШИВАНИЕ
========================================================= */

function shuffle(array) {

    const result = [...array];

    for (
        let i = result.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            result[i],
            result[j]
        ] =
        [
            result[j],
            result[i]
        ];
    }

    return result;
}


/* =========================================================
   ПРОВЕРКА ПЕРЕСЕЧЕНИЯ
========================================================= */

function overlaps(a, b) {

    const padding = 8;

    return !(
        a.right + padding < b.left ||
        a.left - padding > b.right ||
        a.bottom + padding < b.top ||
        a.top - padding > b.bottom
    );
}


/* =========================================================
   ПОЗИЦИИ
========================================================= */

function generatePositions(count) {

    const area =
        document.getElementById(
            "stickersArea"
        );

    const width =
        area.clientWidth;

    const height =
        area.clientHeight;

    const mobile =
        window.innerWidth <= 700;

    const stickerWidth =
        mobile ? 105 : 150;

    const stickerHeight =
        mobile ? 85 : 120;

    const positions = [];


    for (
        let i = 0;
        i < count;
        i++
    ) {

        let placed = false;


        for (
            let attempt = 0;
            attempt < 350;
            attempt++
        ) {

            const left =
                Math.random() *
                Math.max(
                    1,
                    width -
                    stickerWidth
                );

            const top =
                Math.random() *
                Math.max(
                    1,
                    height -
                    stickerHeight
                );


            const candidate = {

                left,
                top,

                right:
                    left +
                    stickerWidth,

                bottom:
                    top +
                    stickerHeight
            };


            let collision =
                false;


            for (
                const existing
                of positions
            ) {

                if (
                    overlaps(
                        candidate,
                        existing
                    )
                ) {

                    collision = true;

                    break;
                }
            }


            if (!collision) {

                positions.push(
                    candidate
                );

                placed = true;

                break;
            }
        }


        /*
           Если места мало,
           допускаем небольшое перекрытие.
        */

        if (!placed) {

            positions.push({

                left:
                    Math.random() *
                    Math.max(
                        1,
                        width -
                        stickerWidth
                    ),

                top:
                    Math.random() *
                    Math.max(
                        1,
                        height -
                        stickerHeight
                    )
            });
        }
    }


    return positions;
}


/* =========================================================
   СОЗДАНИЕ СТИКЕРА
========================================================= */

function createSticker(item, index) {

    const sticker =
        document.createElement("div");

    sticker.className =
        "sticker";


    const inner =
        document.createElement("div");

    inner.className =
        "sticker-inner";


    /* ЛИЦО */

    const front =
        document.createElement("div");

    front.className =
        "sticker-front";

    front.textContent =
        item.title;


    front.style.background =
        colors[
            index %
            colors.length
        ];


    /* ОБОРОТ */

    const back =
        document.createElement("div");

    back.className =
        "sticker-back";

    back.style.background =
        colors[
            index %
            colors.length
        ];


    const routeTitle =
        document.createElement("div");

    routeTitle.className =
        "route-title";

    routeTitle.textContent =
        item.category;


    const route =
        document.createElement("div");

    route.className =
        "route";


    item.steps.forEach(
        step => {

            const row =
                document.createElement("div");

            row.className =
                "route-step";


            const dot =
                document.createElement("span");

            dot.className =
                "route-dot";


            const text =
                document.createElement("span");

            text.className =
                "route-text";

            text.textContent =
                step;


            row.appendChild(dot);
            row.appendChild(text);

            route.appendChild(row);
        }
    );


    back.appendChild(
        routeTitle
    );

    back.appendChild(
        route
    );


    inner.appendChild(
        front
    );

    inner.appendChild(
        back
    );


    sticker.appendChild(
        inner
    );


    return sticker;
}


/* =========================================================
   СОСТОЯНИЕ
========================================================= */

let openedSticker = null;

let originalParent = null;

let originalNextSibling = null;

let flipTimer = null;


/* =========================================================
   OVERLAY
========================================================= */

const overlay =
    document.getElementById(
        "stickerOverlay"
    );


/* =========================================================
   ОТКРЫТИЕ
========================================================= */

function openSticker(sticker) {

    openedSticker =
        sticker;


    /*
       Запоминаем место.
    */

    originalParent =
        sticker.parentNode;

    originalNextSibling =
        sticker.nextSibling;


    /*
       Перемещаем стикер
       в fullscreen-слой.
    */

    overlay.appendChild(
        sticker
    );


    /*
       Показываем overlay.
    */

    overlay.classList.add(
        "active"
    );


    /*
       Прячем заголовок.
    */

    document.body.classList.add(
        "sticker-is-open"
    );


    /*
       Стикер появляется
       в центре лицом вверх.
    */

    sticker.classList.add(
        "open"
    );

    sticker.classList.remove(
        "flipped"
    );


    /*
       ВАЖНО:

       Даём браузеру отрисовать
       появившийся стикер.

       Затем ждём 1 секунду.
    */

    flipTimer =
        setTimeout(
            () => {

                if (
                    openedSticker !==
                    sticker
                ) {
                    return;
                }


                /*
                   Теперь запускаем
                   плавный переворот.
                */

                sticker.classList.add(
                    "flipped"
                );

            },
            1000
        );
}


/* =========================================================
   ЗАКРЫТИЕ
========================================================= */

function closeSticker() {

    if (!openedSticker) {
        return;
    }


    const sticker =
        openedSticker;


    /*
       Отменяем отложенный flip,
       если пользователь успел закрыть
       стикер до истечения секунды.
    */

    clearTimeout(
        flipTimer
    );


    /*
       =====================================================
       КЛЮЧЕВОЙ МОМЕНТ

       НЕ ДЕЛАЕМ:

       sticker.classList.remove("flipped");

       Потому что тогда пользователь увидит
       обратную анимацию.

       Вместо этого стикер просто мгновенно
       возвращается в состояние лицевой стороны
       уже в процессе исчезновения.
       =====================================================
    */


    /*
       Отключаем анимацию flip
       на время возврата.
    */

    sticker.style.transition =
        "none";


    /*
       Сразу ставим лицевую сторону.
    */

    sticker.classList.remove(
        "flipped"
    );


    /*
       Возвращаем transition.
    */

    requestAnimationFrame(
        () => {

            sticker.style.transition =
                "";
        }
    );


    /*
       Запускаем быстрое уменьшение.
    */

    sticker.classList.add(
        "returning"
    );


    /*
       Через 280 мс возвращаем
       его физически на доску.
    */

    setTimeout(
        () => {

            /*
               Убираем состояние open.
            */

            sticker.classList.remove(
                "open"
            );

            sticker.classList.remove(
                "returning"
            );


            /*
               Возвращаем исходный наклон.
            */

            /*
               Возвращаем в исходное место.
            */

            if (
                originalNextSibling &&
                originalNextSibling.parentNode ===
                originalParent
            ) {

                originalParent.insertBefore(
                    sticker,
                    originalNextSibling
                );

            } else {

                originalParent.appendChild(
                    sticker
                );
            }


            /*
               Выключаем overlay.
            */

            overlay.classList.remove(
                "active"
            );


            /*
               Возвращаем заголовок.
            */

            document.body.classList.remove(
                "sticker-is-open"
            );


            /*
               Сбрасываем состояние.
            */

            openedSticker =
                null;

            originalParent =
                null;

            originalNextSibling =
                null;

        },
        280
    );
}


/* =========================================================
   КЛИК ПО СТИКЕРУ
========================================================= */

function toggleSticker(sticker) {

    /*
       Если открыт этот же —
       закрываем.
    */

    if (
        openedSticker === sticker
    ) {

        closeSticker();

        return;
    }


    /*
       Если уже открыт другой —
       сначала закрываем его.
    */

    if (openedSticker) {

        closeSticker();


        setTimeout(
            () => {

                openSticker(
                    sticker
                );

            },
            300
        );

        return;
    }


    openSticker(
        sticker
    );
}


/* =========================================================
   КЛИКИ ПО ДОСКЕ
========================================================= */

overlay.addEventListener(
    "click",
    function(event) {

        /*
           Клик по пустому месту —
           закрыть.
        */

        if (
            event.target === overlay
        ) {

            closeSticker();

            return;
        }


        /*
           Клик по открытому стикеру —
           закрыть.
        */

        const sticker =
            event.target.closest(
                ".sticker"
            );


        if (
            sticker &&
            sticker === openedSticker
        ) {

            closeSticker();
        }
    }
);


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            closeSticker();
        }
    }
);


/* =========================================================
   ОТРИСОВКА
========================================================= */

function render() {

    if (openedSticker) {
        return;
    }


    const area =
        document.getElementById(
            "stickersArea"
        );


    area.innerHTML = "";


    const items =
        shuffle(
            stickers
        );


    const positions =
        generatePositions(
            items.length
        );


    items.forEach(
        (item, index) => {

            const sticker =
                createSticker(
                    item,
                    index
                );


            const position =
                positions[index];


            sticker.style.left =
                position.left +
                "px";


            sticker.style.top =
                position.top +
                "px";


            const rotation =
                Math.random() *
                16 -
                8;


            sticker.style.setProperty(
                "--rotation",
                rotation + "deg"
            );


            sticker.style.zIndex =
                10 + index;


            sticker.addEventListener(
                "click",
                function(event) {

                    event.stopPropagation();

                    toggleSticker(
                        sticker
                    );
                }
            );


            area.appendChild(
                sticker
            );
        }
    );
}


/* =========================================================
   ЗАПУСК
========================================================= */

render();


/* =========================================================
   RESIZE
========================================================= */

let resizeTimer = null;


window.addEventListener(
    "resize",
    function() {

        if (openedSticker) {
            return;
        }


        clearTimeout(
            resizeTimer
        );


        resizeTimer =
            setTimeout(
                () => {

                    render();

                },
                250
            );
    }
);
